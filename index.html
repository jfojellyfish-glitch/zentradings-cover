    :root{--navy:#0E1932;--navy2:#121D39;--ink:#ecf3ff;--muted:#91a4c4;--line:rgba(255,255,255,.11);--accent:#b9d7ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#091124;color:var(--ink);font-family:'Zen Montserrat',Montserrat,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    .shell{max-width:1380px;margin:auto;padding:34px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
    h1{margin:0;font-size:clamp(26px,3vw,40px);font-weight:500;letter-spacing:-.035em}
    header p{margin:8px 0 0;color:var(--muted);font-size:14px}
    .status{color:#9eb2d5;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:26px;align-items:start}
    .panel,.stage{background:rgba(18,29,57,.68);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.24);backdrop-filter:blur(16px)}
    .panel{padding:22px;position:sticky;top:24px}
    .section{padding:0 0 20px;margin:0 0 20px;border-bottom:1px solid var(--line)}
    .section:last-of-type{border:0;margin-bottom:10px;padding-bottom:4px}
    label{display:block;color:#bac8df;font-size:12px;letter-spacing:.08em;margin:0 0 8px;text-transform:uppercase}
    input,select{width:100%;height:45px;border:1px solid var(--line);border-radius:11px;background:#0b1530;color:#f4f7fd;padding:0 13px;font:inherit;outline:none;transition:.2s}
    input:focus,select:focus{border-color:#7194c7;box-shadow:0 0 0 3px rgba(113,148,199,.15)}
    .field{margin:0 0 14px}.field:last-child{margin-bottom:0}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .logoRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .file{position:relative;overflow:hidden;height:45px}
    .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
    button,.file span{border:0;border-radius:11px;height:45px;padding:0 16px;background:#edf3ff;color:#0a1430;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;white-space:nowrap}
    button.secondary,.file span{background:#172544;color:#c9d8ef;border:1px solid var(--line);font-weight:550}
    button:hover,.file span:hover{filter:brightness(1.08)}
    .actions{display:grid;grid-template-columns:1fr auto;gap:10px}
    textarea{width:100%;resize:vertical;min-height:78px;border:1px solid var(--line);border-radius:11px;background:#0b1530;color:#f4f7fd;padding:12px 13px;font:inherit;line-height:1.5;outline:none}
    textarea:focus{border-color:#7194c7;box-shadow:0 0 0 3px rgba(113,148,199,.15)}
    .importActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .importStatus{margin:10px 0 0;color:#91a4c4;font-size:12px;line-height:1.5}
    .importStatus.success{color:#a9dbbf}
    .stage{padding:24px;min-height:650px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
    .canvasWrap{width:100%;display:grid;place-items:center}
    canvas{display:block;width:100%;height:auto;border-radius:13px;box-shadow:0 32px 90px rgba(0,0,0,.42);background:var(--navy)}
    .hint{display:flex;justify-content:space-between;gap:20px;color:#7185a6;font-size:12px;margin-top:15px}
    .safe{color:#91a4c4}
    @media(max-width:900px){.shell{padding:18px}.layout{grid-template-columns:1fr}.panel{position:static}.stage{min-height:auto;padding:14px}header{align-items:flex-start;flex-direction:column}.status{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>Zen Trading 封面生成器</h1><p>编辑日期和关键词，实时生成每日市场封面。</p></div>
      <div class="status">Spot the Pattern, Seek the Unconventional</div>
    </header>
    <div class="layout">
      <aside class="panel">
        <div class="section">
          <div class="row">
            <div class="field"><label for="format">封面比例</label><select id="format"><option value="wide">公众号横版 900×383</option><option value="square">方版 900×900</option></select></div>
            <div class="field"><label for="date">发布日期</label><input id="date" type="date" value="2026-10-01" /></div>
          </div>
        </div>
        <div class="section">
          <div class="field"><label for="series">栏目名称</label><input id="series" value="开市日报 · DAILY BRIEF" maxlength="32" /></div>
          <div class="field"><label for="k1">核心关键词 01</label><input id="k1" value="美债收益率新高" maxlength="18" /></div>
          <div class="field"><label for="k2">核心关键词 02</label><input id="k2" value="软件股逆势上涨" maxlength="18" /></div>
          <div class="field"><label for="k3">核心关键词 03（可留空）</label><input id="k3" value="市场信号" maxlength="18" /></div>
          <div class="field"><label for="tags">英文标签</label><input id="tags" value="TREASURY YIELDS · SOFTWARE · MARKET SIGNALS" maxlength="60" /></div>
        </div>
        <div class="section">
          <div class="field"><label for="articleTitle">粘贴公众号文章标题</label><textarea id="articleTitle" placeholder="例如：美债收益率创02年以来新高 软件股逆势支撑美股（日更·2026-10-01）"></textarea></div>
          <div class="importActions"><button class="secondary" id="parseTitle" type="button">从标题识别</button><button class="secondary" id="clearImport" type="button">清空</button></div>
          <div class="field" style="margin-top:14px"><label for="botJson">导入 AI Bot JSON</label><textarea id="botJson" placeholder='{"publish_date":"2026-10-01","cover_keywords":["美债收益率新高","软件股逆势支撑","美股"],"english_tags":["US TREASURY YIELDS","SOFTWARE STOCKS","US EQUITIES"]}'></textarea></div>
          <button class="secondary" id="importJson" type="button" style="width:100%">导入 AI Bot JSON</button>
          <p class="importStatus" id="importStatus">文章标题和 JSON 都只在本地浏览器处理。</p>
        </div>
        <div class="section">
          <div class="logoRow">
            <div class="field"><label>临时替换 Logo（可选）</label><div class="file"><span id="logoText">使用官网默认 Logo</span><input id="logo" type="file" accept="image/png,image/jpeg,image/svg+xml" /></div></div>
            <button class="secondary" id="clearLogo" title="恢复官网默认 Logo">恢复默认</button>
          </div>
        </div>
        <div class="actions"><button id="download">下载 PNG</button><button class="secondary" id="reset">恢复示例</button></div>
      </aside>
      <section class="stage">
        <div class="canvasWrap"><canvas id="canvas" width="900" height="383" aria-label="封面预览"></canvas></div>
        <div class="hint"><span>预览会随输入自动更新</span><span class="safe">所有内容仅在你的浏览器内处理</span></div>
      </section>
    </div>
  </main>

      ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(232,240,252,.92)';ctx.lineWidth=Math.max(1.5,s*.035);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(0,s*.28);ctx.bezierCurveTo(s*.18,s*.02,s*.48,s*.02,s*.7,s*.12);ctx.bezierCurveTo(s*.45,s*.2,s*.22,s*.44,s*.14,s*.72);ctx.bezierCurveTo(s*.42,s*.55,s*.68,s*.55,s*.92,s*.64);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s*.3,s*.08);ctx.bezierCurveTo(s*.56,s*.35,s*.57,s*.58,s*.45,s*.9);ctx.moveTo(s*.76,s*.1);ctx.bezierCurveTo(s*.6,s*.34,s*.58,s*.62,s*.8,s*.88);ctx.stroke();ctx.restore();
    }
    function drawBackground(w,h){
      const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0E1932');g.addColorStop(.55,'#0a1732');g.addColorStop(1,'#121D39');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      const glow=ctx.createRadialGradient(w*.75,h*.28,0,w*.75,h*.28,w*.56);glow.addColorStop(0,'rgba(64,105,172,.18)');glow.addColorStop(1,'rgba(8,16,36,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
      stars.forEach(p=>{ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(210,226,250,${p.a})`;ctx.fill()});
      ctx.strokeStyle='rgba(136,169,218,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w*.06,h*.83);ctx.bezierCurveTo(w*.32,h*.55,w*.58,h*.96,w*.94,h*.62);ctx.stroke();
    }
    function drawBrand(w,h,pad){
      const size=h*.095;
      const ratio=brandLogo && brandLogo.complete && brandLogo.naturalWidth ? brandLogo.naturalWidth/brandLogo.naturalHeight : 1;
      ctx.font=`600 ${Math.max(14,h*.038)}px 'Zen Montserrat', Montserrat, sans-serif`;ctx.letterSpacing='4px';
      const textWidth=ctx.measureText('ZEN TRADING').width+40;
      const groupWidth=size*ratio+18+textWidth;
      const logoX=(w-groupWidth)/2;
      if(brandLogo && brandLogo.complete) ctx.drawImage(brandLogo,logoX,pad,size*ratio,size); else drawMark(logoX,pad*.86,size);
      ctx.fillStyle='rgba(238,244,253,.92)';ctx.textAlign='left';ctx.fillText('ZEN TRADING',logoX+size*ratio+18,pad+size*.64);ctx.letterSpacing='0px';
    }
    function render(){
      const square=$('format').value==='square'; canvas.width=900;canvas.height=square?900:383;
      const w=canvas.width,h=canvas.height,pad=square?66:52;drawBackground(w,h);drawBrand(w,h,pad);
      const raw=$('date').value||new Date().toISOString().slice(0,10);const d=new Date(raw+'T12:00:00');
      const month=d.toLocaleString('en-GB',{month:'short'}).toUpperCase();const day=String(d.getDate()).padStart(2,'0');const year=d.getFullYear();
      ctx.textAlign='center';
      if(square){
        ctx.fillStyle='#eef4ff';ctx.font="300 116px 'Zen Montserrat', Montserrat, sans-serif";ctx.fillText(`${month} ${day}`,w/2,310);ctx.font="300 52px 'Zen Montserrat', Montserrat, sans-serif";ctx.fillStyle='#9fb5d7';ctx.fillText(String(year),w/2,374);
        ctx.fillStyle='#91a7c9';ctx.font="500 17px 'Zen Montserrat', Montserrat, PingFang SC, sans-serif";ctx.fillText($('series').value.toUpperCase(),w/2,448);
        const keys=[$('k1').value,$('k2').value,$('k3').value].filter(Boolean);let y=535;keys.forEach((t,i)=>{const fs=fitText(t,w-pad*2,52,28);ctx.fillStyle=i===0?'#f2f6fd':'#c2d0e5';ctx.font=`${i===0?500:350} ${fs}px 'Zen Montserrat', Montserrat, PingFang SC, sans-serif`;ctx.fillText(t,w/2,y);y+=70});
        ctx.fillStyle='#8298bb';ctx.font="500 15px 'Zen Montserrat', Montserrat, sans-serif";ctx.fillText($('tags').value.toUpperCase(),w/2,h-pad);
      }else{
        ctx.fillStyle='#91a7c9';ctx.font="500 14px 'Zen Montserrat', Montserrat, PingFang SC, sans-serif";ctx.fillText($('series').value.toUpperCase(),w/2,154);
        ctx.fillStyle='#eef4ff';ctx.font="300 62px 'Zen Montserrat', Montserrat, sans-serif";ctx.fillText(`${year}.${String(d.getMonth()+1).padStart(2,'0')}.${day}`,w/2,224);
        const keys=[$('k1').value,$('k2').value,$('k3').value].filter(Boolean);const parts=keys.map((t,i)=>{const fs=fitText(t,260,28,18);ctx.font=`${i===0?500:350} ${fs}px 'Zen Montserrat', Montserrat, PingFang SC, sans-serif`;return {t,i,fs,width:ctx.measureText(t).width}});const total=parts.reduce((n,p)=>n+p.width,0)+Math.max(0,parts.length-1)*25;let x=(w-total)/2;ctx.textAlign='left';parts.forEach((p,index)=>{ctx.font=`${p.i===0?500:350} ${p.fs}px 'Zen Montserrat', Montserrat, PingFang SC, sans-serif`;ctx.fillStyle=p.i===0?'#f1f5fc':'#b8c8df';ctx.fillText(p.t,x,287);x+=p.width+25;if(index<parts.length-1){ctx.fillStyle='#496180';ctx.fillRect(x-13,268,1,22)}});
        ctx.textAlign='center';ctx.fillStyle='#7f95b7';ctx.font="500 11px 'Zen Montserrat', Montserrat, sans-serif";ctx.fillText($('tags').value.toUpperCase(),w/2,h-37);
      }
      ctx.textAlign='left';
    }
    function setImportStatus(message,success=false){const el=$('importStatus');el.textContent=message;el.classList.toggle('success',success)}
    function listValue(value){
      if(Array.isArray(value)) return value.map(v=>String(v).trim()).filter(Boolean);
      if(typeof value==='string') return value.split(/[·•,，;；|｜]+/).map(v=>v.trim()).filter(Boolean);
      return [];
    }
    function setCoverFields(data){
      const date=data.publish_date||data.date||data.published_at;
      if(date){const match=String(date).match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);if(match)$('date').value=`${match[1]}-${String(match[2]).padStart(2,'0')}-${String(match[3]).padStart(2,'0')}`}
      if(data.section||data.series)$('series').value=String(data.section||data.series);
      const keywords=listValue(data.cover_keywords||data.keywords||data.coverKeywords).slice(0,3);
      ['k1','k2','k3'].forEach((id,i)=>$(id).value=keywords[i]||'');
      const tags=listValue(data.english_tags||data.tags||data.englishTags);
      if(tags.length)$('tags').value=tags.join(' · ').toUpperCase();
      render();
      return keywords.length>0||Boolean(date);
    }
    function parseArticleTitle(){
      const raw=$('articleTitle').value.trim();
      if(!raw){setImportStatus('请先粘贴公众号文章标题。');return}
      const dateMatch=raw.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);
      const titleWithoutDate=raw.replace(/[（(][^）)]*(20\d{2}[-/.]\d{1,2}[-/.]\d{1,2})[^）)]*[）)]/g,'').trim();
      const clean=titleWithoutDate.replace(/[“”"']/g,'').trim();
      const parts=clean.split(/\s+/).flatMap(part=>part.split(/[、，,;；|｜]+/)).map(v=>v.trim()).filter(Boolean).slice(0,3);
      const data={cover_keywords:parts};
      if(dateMatch)data.publish_date=`${dateMatch[1]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[3]).padStart(2,'0')}`;
      setCoverFields(data);
      setImportStatus(`已识别${dateMatch?'日期和':''} ${parts.length} 个封面关键词。英文标签请按文章主题检查。`,true);
    }
    function importBotJson(){
      const raw=$('botJson').value.trim();
      if(!raw){setImportStatus('请先粘贴 AI Bot 输出的 JSON。');return}
      try{const data=JSON.parse(raw);if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('JSON 顶层必须是对象');const ok=setCoverFields(data);if(!ok)throw new Error('没有找到日期或 cover_keywords');setImportStatus('AI Bot JSON 已导入，封面字段已自动更新。',true)}catch(error){setImportStatus(`JSON 导入失败：${error.message}`)}
    }
    fields.forEach(el=>el.addEventListener('input',render));
    $('parseTitle').addEventListener('click',parseArticleTitle);
    $('importJson').addEventListener('click',importBotJson);
    $('clearImport').addEventListener('click',()=>{$('articleTitle').value='';$('botJson').value='';setImportStatus('文章标题和 JSON 输入已清空。')});
    $('logo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{brandLogo=img;$('logoText').textContent=file.name;render()};img.src=URL.createObjectURL(file)});
    $('clearLogo').addEventListener('click',()=>{brandLogo=defaultLogo;$('logo').value='';$('logoText').textContent='使用官网默认 Logo';render()});
    $('reset').addEventListener('click',()=>{ $('format').value='wide';$('date').value='2026-10-01';$('series').value='开市日报 · DAILY BRIEF';$('k1').value='美债收益率新高';$('k2').value='软件股逆势上涨';$('k3').value='市场信号';$('tags').value='TREASURY YIELDS · SOFTWARE · MARKET SIGNALS';render() });
    $('download').addEventListener('click',()=>{render();const a=document.createElement('a');a.download=`ZenTrading_${$('date').value||'cover'}_${$('format').value}.png`;a.href=canvas.toDataURL('image/png');a.click()});
    document.fonts.ready.then(render);
  </script>
</body>
